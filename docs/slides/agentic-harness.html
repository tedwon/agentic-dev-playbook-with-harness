</ul>

<p><code>.claude/settings.json</code>에서 AI가 실행할 수 있는 명령어를 <strong>허용/차단</strong> 설정</p>
<h3 id="allow--%ED%97%88%EC%9A%A9%EB%90%9C-%EB%AA%85%EB%A0%B9%EC%96%B4%EB%A7%8C-%EC%8B%A4%ED%96%89-%EA%B0%80%EB%8A%A5">ALLOW — 허용된 명령어만 실행 가능</h3>
<div style="background:#f5f5f7; padding:14px 20px; border-radius:12px; font-family:'JetBrains Mono',monospace; font-size:14px; color:#1b3a5c;">
"allow": [ "Bash(./mvnw *)", "Bash(git status*)", "Bash(git log*)",<br />
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"Bash(git diff*)", "Bash(git add *)", "Bash(git commit *)" ]
</div>
<h3 id="deny--%EC%9C%84%ED%97%98%ED%95%9C-%EB%AA%85%EB%A0%B9%EC%96%B4-%EC%9B%90%EC%B2%9C-%EC%B0%A8%EB%8B%A8">DENY — 위험한 명령어 원천 차단</h3>
<div style="background:#f5f5f7; padding:14px 20px; border-radius:12px; font-family:'JetBrains Mono',monospace; font-size:14px; color:#1b3a5c;">
"deny": [ "Bash(rm -rf *)", "Bash(git commit --no-verify*)" ]
</div>
<ul>
<li><code>rm -rf</code> → <strong>파일 삭제 차단</strong></li>
<li><code>--no-verify</code> → <strong>Harness 우회 차단</strong> (가장 중요!)</li>
</ul>

<p><a href="https://github.com/tedwon/agentic-dev-playbook-with-harness/blob/main/.claude/settings.json">settings.json</a></p>

<h1 id="agentic-ai%EB%9E%80--%ED%95%99%EA%B3%84%EC%9D%98-%EC%A0%95%EC%9D%98">Agentic AI란? — 학계의 정의</h1>
<blockquote>
<p><em>&quot;목표를 달성하기 위해 맥락을 인식하고, 계획하고, 다단계 행동을 자율적으로 실행하는 시스템&quot;</em><br />
— <a href="https://arxiv.org/pdf/2603.27075">arxiv.org/pdf/2603.27075</a></p>
</blockquote>
<h3 id="%EC%A7%84%EC%A7%9C-ai-agent%EC%9D%98-%EA%B5%AC%EC%84%B1-%EC%9A%94%EC%86%8C">진짜 AI AGENT의 구성 요소</h3>
<table>
<thead>
<tr>
<th>요소</th>
<th>설명</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Goal-driven</strong></td>
<td>목표를 받고 자율적으로 실행</td>
</tr>
<tr>
<td><strong>Planning</strong></td>
<td>작업을 단계로 분해</td>
</tr>
<tr>
<td><strong>Tool Use</strong></td>
<td>API, 코드, 외부 시스템 호출</td>
</tr>
<tr>
<td><strong>Memory</strong></td>
<td>단계 간 상태 유지</td>
</tr>
<tr>
<td><strong>Loop (ReAct)</strong></td>
<td>Think → Act → Observe → 반복</td>
</tr>
<tr>
<td><strong>Multi-agent</strong></td>
<td>여러 에이전트가 협업 (선택)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>출처: <a href="https://arxiv.org/html/2601.02749v1">arxiv.org/html/2601.02749</a> · <a href="https://arxiv.org/pdf/2601.12560">arxiv.org/pdf/2601.12560</a> · <a href="https://arxiv.org/pdf/2510.25445">arxiv.org/pdf/2510.25445</a></p>
</blockquote>

<h1 id="playbook%EC%9D%98-%EC%9E%A5%EC%A0%90">Playbook의 장점</h1>
<h3 id="%EA%B5%AC%EC%A1%B0-%EC%97%86%EC%9D%B4-ai%EC%97%90%EA%B2%8C-%EB%A7%8C%EB%93%A4%EC%96%B4%EC%A4%98%EB%9D%BC%EA%B3%A0-%ED%95%98%EB%A9%B4">구조 없이 AI에게 &quot;만들어줘&quot;라고 하면?</h3>
<ul>
<li>AI가 <strong>방향 없이</strong> 코드를 쏟아냄 → 원하지 않는 결과물</li>
<li>&quot;알아서 판단하는 AI&quot; 문제 그대로 발생</li>
</ul>
<h3 id="playbook%EC%9D%B4-%ED%95%B4%EA%B2%B0%ED%95%98%EB%8A%94-%EA%B2%83">Playbook이 해결하는 것</h3>
<ul>
<li><strong>설계 → 실행 분리</strong>: 사람이 먼저 방향을 잡음</li>
<li><strong>Human-in-the-loop</strong>: 각 단계마다 사람이 확인하고 승인</li>
<li><strong>Spec + Plan 문서화</strong>: AI가 뭘 만들지 미리 합의 (새 세션으로 핸드오프 가능)</li>
</ul>
<blockquote>
<p>Playbook 덕분에 AI가 <strong>엉뚱한 방향</strong>으로 달려가는 건 막을 수 있게 되었다.</p>
</blockquote>
</section>

<h1 id="mitchell-hashimoto--engineer-the-harness-2026-2-5">Mitchell Hashimoto — &quot;Engineer the Harness&quot; (2026. 2. 5)</h1>
<p>HashiCorp 창업자가 자신의 <strong>AI 도입 6단계</strong>를 공개</p>
<table>
<thead>
<tr>
<th>Phase</th>
<th>단계</th>
<th>내용</th>
</tr>

<tbody>

</tr>
<tr>
<td>2</td>
<td>Reproduce Your Own Work</td>
<td>같은 작업을 수동 + AI로 반복하며 학습</td>
</tr>
<tr>
<td>3</td>
<td>End-of-Day Agents</td>
<td>퇴근 시 에이전트에게 리서치 위임</td>
</tr>
<tr>
<td>4</td>
<td>Outsource the Slam Dunks</td>
<td>확실한 작업을 에이전트에게 위임</td>
</tr>
<tr>
<td>5</td>
<td><strong>Engineer the Harness</strong></td>
<td><strong>에이전트 실수를 구조적으로 방지</strong></td>
</tr>
<tr>
<td>6</td>

<p>개발자의 <strong>80%</strong> 가 AI 코딩 도구를 사용하고 있지만... — <a href="https://survey.stackoverflow.co/2025/">Stack Overflow 2025</a></p>

<h1 id="harness-engineering%EC%9D%B4%EB%9E%80">Harness Engineering이란?</h1>
<p>AI 에이전트가 <strong>자율적으로 일하되, 안전하게</strong> 일할 수 있는 구조를 설계하는 것</p>
<h3 id="%EB%91%90-%EA%B0%80%EC%A7%80-%EC%A0%9C%EC%96%B4-%EB%B0%A9%EC%8B%9D">두 가지 제어 방식</h3>
<table>
<thead>
<tr>
<th>제어 유형</th>
<th>언제?</th>
<th>어떻게?</th>
<th>구현 파일</th>
</tr>
</thead>
<tbody>
<tr>
<td><em>Feedforward</em> (예방)</td>
<td>실수 <strong>전에</strong></td>
<td>규칙을 미리 읽게 함</td>
<td><code>CLAUDE.md</code>, <code>AGENTS.md</code></td>
</tr>
<tr>
<td><em>Feedback</em> (교정)</td>
<td>실수 <strong>후에</strong></td>
<td>에러 감지 → 수정 유도</td>
<td>Pre-commit hooks</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>핵심 원리:</strong><br />
에이전트가 규칙을 읽고(Feedforward), 위반 시 스스로 고치고(Feedback),<br />
<strong>사람 개입 없이</strong> 반복한다.</p>
</blockquote>

<h1 id="self-correction-loop">Self-Correction Loop</h1>
<p><strong>사람의 개입 없이</strong> 에이전트가 스스로 교정하는 핵심 메커니즘</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Agent가 코드 작성
    |
git commit 시도
    |
Pre-commit Harness --&gt; 7가지 검증 실행
    |-- 모두 통과? --&gt; Commit 성공
    |-- 실패? --&gt; Commit 차단 + 상세 에러 메시지
                    |
          Agent가 에러를 읽고 수정
                    |
          다시 commit 시도 (반복)
</code></pre>
<blockquote>
<p>이 루프가 작동하려면 에러 메시지가 <strong>LLM이 이해할 수 있는 형태</strong>여야 한다.</p>
</blockquote>

<h1 id="7%EA%B0%80%EC%A7%80-%EC%9E%90%EB%8F%99-%EA%B2%80%EC%A6%9D-%EA%B7%9C%EC%B9%99">7가지 자동 검증 규칙</h1>
<p>모든 <code>git commit</code> 전에 <strong>7개 검증을 동시에</strong> 실행</p>
<table>
<thead>
<tr>
<th>ID</th>
<th>Check</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>BUILD-01</td>
<td>컴파일 검증</td>
<td><code>./mvnw compile -q</code></td>
</tr>
<tr>
<td>BUILD-02</td>
<td>테스트 검증</td>
<td><code>./mvnw test</code></td>
</tr>
<tr>
<td>BUILD-03</td>
<td>포맷팅 검증</td>
<td><code>./mvnw spotless:check -q</code></td>
</tr>
<tr>
<td>QUAL-01</td>
<td>System.out 금지</td>
<td><code>org.jboss.logging.Logger</code> 사용 강제</td>
</tr>
<tr>
<td>QUAL-02</td>
<td>시크릿 금지</td>
<td><code>@ConfigProperty</code> 사용 강제</td>
</tr>
<tr>
<td>CONV-01</td>
<td>Conventional Commits</td>
<td><code>feat(scope): subject</code> 형식</td>
</tr>
<tr>
<td>CONV-02</td>
<td>테스트 커버리지</td>
<td>모든 <code>@Path</code> 클래스에 <code>*Test.java</code> 필수</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>설계 원칙:</strong> 모든 실패를 <strong>한 번에</strong> 보여줘야 에이전트가 <strong>한 번에</strong> 고친다.</p>
</blockquote>
</section>
