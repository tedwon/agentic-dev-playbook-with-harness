<h1 id="uncontrolled-ai-is-dangerous">Uncontrolled AI Is Dangerous</h1>
<table>
<thead>
<tr>
<th style="text-align:center">What I Want from AI</th>
<th style="text-align:center">What AI Actually Does</th>

</tr>
<tr>
<td style="text-align:center">Verify <strong>step by step</strong></td>

</tr>

<ul>
<li>Modifies <strong>dozens of files</strong> in a single request</li>
<li>Proceeds with tasks <strong>on its own judgment</strong> that it should have asked about first</li>
</ul>
<blockquote>
<p><strong>This is why Harness is needed.</strong><br />
A structure that <strong>limits</strong> AI's autonomy and <strong>verifies</strong> at each step is essential.</p>

<h1 id="humans-are-the-bottleneck">Humans Are the Bottleneck</h1>
<p>AI agents work <strong>fast and at scale</strong> — the problem is that <strong>humans have to review all the results</strong></p>
<ul>
<li>Changes AI made in <strong>5 minutes</strong> take humans <strong>1 hour</strong> to review</li>
<li>30 files modified at once — humans <strong>cannot review every detail</strong></li>
<li>Skip reviews → <strong>quality collapse</strong>, Do reviews → <strong>productivity bottleneck</strong></li>
</ul>
<br />
<blockquote>
<p>That's why <strong>automated verification (Harness)</strong> is essential.<br />
Instead of humans checking everything, <strong>machines verify and humans only make judgments</strong>.</p>

<h3 id="multiple-claudemd-files-%E2%86%92-loaded-by-priority">Multiple CLAUDE.MD files? → Loaded by priority</h3>
<table>

<tr>
<th style="text-align:center">Priority</th>

</tr>

<h1 id="andrej-karpathys-claudemd-guidelines">Andrej Karpathy's CLAUDE.md Guidelines</h1>
<p><strong>Andrej Karpathy</strong> (ex-Tesla AI / OpenAI) identified core issues with LLM coding:</p>
<blockquote>
<p><em>&quot;The model makes wrong assumptions on your behalf and runs with them...</em><br />
<em>It overcomplicates code... and changes or deletes code it doesn't understand.&quot;</em></p>
</blockquote>
<h3 id="4-principles-implemented-via-claudemd">4 Principles (Implemented via CLAUDE.MD)</h3>
<table>
<thead>
<tr>
<th>Principle</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Think Before Coding</strong></td>
<td>Don't assume — <strong>ask first</strong>, then start</td>
</tr>
<tr>
<td><strong>Simplicity First</strong></td>
<td>Implement <strong>only</strong> what was requested, no over-engineering</td>
</tr>
<tr>
<td><strong>Surgical Changes</strong></td>
<td>Modify <strong>only what's needed</strong>, no unrelated refactoring</td>
</tr>
<tr>
<td><strong>Goal-Driven Execution</strong></td>
<td>Don't dictate actions — provide <strong>success criteria</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>Install: <code>/plugin install andrej-karpathy-skills@karpathy-skills</code><br />
GitHub: <a href="https://github.com/forrestchang/andrej-karpathy-skills">forrestchang/andrej-karpathy-skills</a></p>
</blockquote>

<h1 id="settingsjson--preventing-ai-mishaps-proactively">settings.json — Preventing AI Mishaps Proactively</h1>
<p>Configure which commands AI can execute via <strong>allow/deny</strong> in <code>.claude/settings.json</code></p>
<h3 id="allow--only-permitted-commands-can-run">ALLOW — Only permitted commands can run</h3>
<div style="background:#f5f5f7; padding:14px 20px; border-radius:12px; font-family:'JetBrains Mono',monospace; font-size:14px; color:#1b3a5c;">
"allow": [ "Bash(./mvnw *)", "Bash(git status*)", "Bash(git log*)",<br />
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"Bash(git diff*)", "Bash(git add *)", "Bash(git commit *)" ]
</div>
<h3 id="deny--block-dangerous-commands-entirely">DENY — Block dangerous commands entirely</h3>
<div style="background:#f5f5f7; padding:14px 20px; border-radius:12px; font-family:'JetBrains Mono',monospace; font-size:14px; color:#1b3a5c;">
"deny": [ "Bash(rm -rf *)", "Bash(git commit --no-verify*)" ]
</div>
<ul>
<li><code>rm -rf</code> → <strong>Block file deletion</strong></li>
<li><code>--no-verify</code> → <strong>Block Harness bypass</strong> (most important!)</li>
</ul>
<blockquote>
<p><a href="https://github.com/tedwon/agentic-dev-playbook-with-harness/blob/main/.claude/settings.json">settings.json</a></p>
</blockquote>

<h1 id="4-tips-for-efficient-usage">4 Tips for Efficient Usage</h1>
<h3 id="1-use-claudemd">1. Use <code>CLAUDE.MD</code></h3>
<p>Place a rules file at the project root → AI <strong>reads it automatically</strong> → no need to repeat the same instructions</p>
<h3 id="2-compress-context-with-compact">2. Compress Context with <code>/COMPACT</code></h3>
<p>When conversations get long, use <code>/compact</code> → summarizes previous content → <strong>saves tokens</strong></p>
<h3 id="3-separate-sessions">3. Separate Sessions</h3>
<p>Run Design and Execute in <strong>separate sessions</strong> → prevents context window exhaustion</p>
<h3 id="4-leverage-skills--plugins">4. Leverage SKILLS &amp; PLUGINS</h3>
<p>Automate repetitive tasks with Skills → <strong>no need for the same prompts</strong> every time</p>

<p>Following just these 4 tips can <strong>save 50%+ in costs</strong></p>

<h1 id="what-is-agentic-ai--the-academic-definition">What Is Agentic AI? — The Academic Definition</h1>
<blockquote>
<p><em>&quot;A system that autonomously perceives context, plans, and executes multi-step actions to achieve goals&quot;</em><br />
— <a href="https://arxiv.org/pdf/2603.27075">arxiv.org/pdf/2603.27075</a></p>
</blockquote>
<h3 id="components-of-a-true-ai-agent">Components of a True AI Agent</h3>
<table>
<thead>
<tr>
<th>Component</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Goal-driven</strong></td>
<td>Receives a goal and executes autonomously</td>
</tr>
<tr>
<td><strong>Planning</strong></td>
<td>Breaks tasks into steps</td>
</tr>
<tr>
<td><strong>Tool Use</strong></td>
<td>Calls APIs, code, external systems</td>
</tr>
<tr>
<td><strong>Memory</strong></td>
<td>Maintains state across steps</td>
</tr>
<tr>
<td><strong>Loop (ReAct)</strong></td>
<td>Think → Act → Observe → Repeat</td>
</tr>
<tr>
<td><strong>Multi-agent</strong></td>
<td>Multiple agents collaborate (optional)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Sources: <a href="https://arxiv.org/html/2601.02749v1">arxiv.org/html/2601.02749</a> · <a href="https://arxiv.org/pdf/2601.12560">arxiv.org/pdf/2601.12560</a> · <a href="https://arxiv.org/pdf/2510.25445">arxiv.org/pdf/2510.25445</a></p>
</blockquote>

<h1 id="the-truth-about-agentic--lets-be-honest">The Truth About &quot;Agentic&quot; — Let's Be Honest</h1>
<blockquote>
<p>Is this a <strong>true AI agent system</strong>? Or is it a <strong>structured framework for systematically leveraging AI</strong>?</p>
</blockquote>
<ul>
<li>It's NOT a fully autonomous multi-agent system</li>
<li>It IS a <strong>structured workflow designed to behave agent-like</strong></li>
<li>Most real-world &quot;agentic&quot; systems: one LLM + sequential calls + prompt chaining</li>
</ul>
<blockquote>
<p><em>&quot;Agentic is frequently used as a marketing term&quot;</em> — <a href="https://arxiv.org/pdf/2506.01463">arxiv.org/pdf/2506.01463</a><br />
Not real agents talking to each other, but <strong>orchestrated LLM workflows</strong></p>
</blockquote>

<h1 id="benefits-of-the-playbook">Benefits of the Playbook</h1>
<h3 id="what-happens-when-you-tell-ai-just-build-it-without-structure">What happens when you tell AI &quot;just build it&quot; without structure?</h3>
<ul>
<li>AI <strong>dumps code without direction</strong> → unwanted results</li>
<li>The &quot;AI decides on its own&quot; problem persists</li>
</ul>
<h3 id="what-the-playbook-solves">What the Playbook Solves</h3>
<ul>
<li><strong>Design → Execute separation</strong>: humans set the direction first</li>
<li><strong>Human-in-the-loop</strong>: humans review and approve at each step</li>
<li><strong>Spec + Plan documentation</strong>: agree on what AI will build beforehand (enables handoff to new sessions)</li>
</ul>
<blockquote>
<p>Thanks to the Playbook, we can prevent AI from <strong>running off in the wrong direction</strong>.</p>
</blockquote>

<h1 id="mitchell-hashimoto--engineer-the-harness-2026-2-5">Mitchell Hashimoto — &quot;Engineer the Harness&quot; (2026. 2. 5)</h1>
<p>The HashiCorp founder shared his <strong>6-stage AI adoption journey</strong></p>
<table>
<thead>
<tr>
<th>Phase</th>
<th>Stage</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Drop the Chatbot</td>
<td>Move beyond chatbots to <strong>agents</strong></td>
</tr>
<tr>
<td>2</td>
<td>Reproduce Your Own Work</td>
<td>Repeat the same task manually + with AI to learn</td>
</tr>
<tr>
<td>3</td>
<td>End-of-Day Agents</td>
<td>Delegate research to agents when leaving work</td>
</tr>
<tr>
<td>4</td>
<td>Outsource the Slam Dunks</td>
<td>Delegate straightforward tasks to agents</td>
</tr>
<tr>
<td>5</td>
<td><strong>Engineer the Harness</strong></td>
<td><strong>Structurally prevent agent mistakes</strong></td>
</tr>
<tr>
<td>6</td>
<td>Always Have an Agent Running</td>
<td>Keep agents running at all times</td>
</tr>
</tbody>
</table>
<blockquote>
<p><em>&quot;Every time an agent makes a mistake, build a structure so that mistake never happens again.&quot;</em></p>
</blockquote>
<ul>
<li><strong>AGENTS.md</strong>: <em>&quot;Every line in that file is based on bad agent behavior&quot;</em></li>
</ul>
<blockquote>
<p>Source: <a href="https://mitchellh.com/writing/my-ai-adoption-journey">mitchellh.com/writing/my-ai-adoption-journey</a></p>
</blockquote>

<h1 id="openai--agent--model--harness-2026-2-11">OpenAI — Agent = Model + Harness (2026. 2. 11)</h1>
<ul>
<li><strong>A small team (3→7 engineers), 0 lines of code written manually, 1,500 PRs, 1M lines</strong> — all written by agents</li>
<li>Presented the <code>Agent = Model + Harness</code> formula</li>
<li>LangChain: Improved only the Harness → <strong>Terminal Bench 2.0</strong> from 30th → 5th place (no model change)</li>
</ul>
<blockquote>
<p><em>&quot;The hard part isn't the Agent — it's the Harness.&quot;</em> — OpenAI</p>
</blockquote>
<h3 id="anthropic--deep-dive-into-harness-design-2026-3-24">ANTHROPIC — DEEP DIVE INTO HARNESS DESIGN (2026. 3. 24)</h3>
<ul>
<li>Multi-agent harness: <em>Initializer (task decomposition) → Coding Agent (implementation) → verification loop</em></li>
<li>Solo agent ($9, doesn't work) vs Harness ($200, works perfectly) → <strong>structure, not cost, determines quality</strong></li>
</ul>
<blockquote>
<p><em>&quot;Every component of the harness encodes an assumption about what the model can't do on its own.&quot;</em></p>
</blockquote>
<blockquote>

<p><strong>80%</strong> of developers use AI coding tools, but... — <a href="https://survey.stackoverflow.co/2025/">Stack Overflow 2025</a></p>
<ul>

<li>Only <strong>29% of developers trust</strong> AI code in production — <a href="https://survey.stackoverflow.co/2025/">Stack Overflow 2025</a></li>
<li>Increasing <strong>incident reports</strong> from teams merging AI code without review</li>
</ul>
<br />
<h3 id="the-root-cause">The Root Cause</h3>
<blockquote>
<p>It's not that AI models lack capability.<br />
<strong>The absence of verification structure (Harness) is the problem.</strong></p>

<h1 id="what-is-harness-engineering">What Is Harness Engineering?</h1>
<p>Designing structures that allow AI agents to <strong>work autonomously yet safely</strong></p>
<h3 id="two-types-of-control">Two Types of Control</h3>
<table>
<thead>
<tr>
<th>Control Type</th>
<th>When?</th>
<th>How?</th>
<th>Implementation Files</th>
</tr>
</thead>
<tbody>
<tr>
<td><em>Feedforward</em> (Prevention)</td>
<td><strong>Before</strong> mistakes</td>
<td>Make agents read rules in advance</td>
<td><code>CLAUDE.md</code>, <code>AGENTS.md</code></td>
</tr>
<tr>
<td><em>Feedback</em> (Correction)</td>
<td><strong>After</strong> mistakes</td>
<td>Detect errors → guide fixes</td>
<td>Pre-commit hooks</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Core Principle:</strong><br />
The agent reads the rules (Feedforward), self-corrects on violations (Feedback),<br />
and iterates <strong>without human intervention</strong>.</p>

<h1 id="7-automated-verification-rules">7 Automated Verification Rules</h1>
<p><strong>7 checks run simultaneously</strong> before every <code>git commit</code></p>
<table>
<thead>
<tr>
<th>ID</th>
<th>Check</th>
<th>Description</th>
</tr>
</thead>
<tbody>
<tr>
<td>BUILD-01</td>
<td>Compile verification</td>
<td><code>./mvnw compile -q</code></td>
</tr>
<tr>
<td>BUILD-02</td>
<td>Test verification</td>
<td><code>./mvnw test</code></td>
</tr>
<tr>
<td>BUILD-03</td>
<td>Formatting verification</td>
<td><code>./mvnw spotless:check -q</code></td>
</tr>
<tr>
<td>QUAL-01</td>
<td>No System.out</td>
<td>Enforce <code>org.jboss.logging.Logger</code> usage</td>
</tr>
<tr>
<td>QUAL-02</td>
<td>No secrets</td>
<td>Enforce <code>@ConfigProperty</code> usage</td>
</tr>
<tr>
<td>CONV-01</td>
<td>Conventional Commits</td>
<td><code>feat(scope): subject</code> format</td>
</tr>
<tr>
<td>CONV-02</td>
<td>Test coverage</td>
<td><code>*Test.java</code> required for every <code>@Path</code> class</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Design principle:</strong> Show all failures <strong>at once</strong> so the agent can fix them <strong>all at once</strong>.</p>
</blockquote>
</section>

<h1 id="3-hook-system">3-Hook System</h1>
<table>

<tr>

<th>When</th>
<th>Action</th>

</tr>

<td>On <code>git commit</code></td>
<td>Runs 7 verification checks</td>
<td>Commit <strong>blocked</strong></td>
</tr>
<tr>
<td><strong>File Protection</strong></td>
<td>On file modification</td>
<td>Detects rule file tampering</td>
<td>Modification <strong>blocked</strong></td>
</tr>
<tr>
<td><strong>Post-edit Verify</strong></td>
<td>After <code>.java</code> edits</td>
<td>Immediate compile check</td>
<td>Warning only</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Why File Protection is needed:</strong><br />
The <strong>easiest way</strong> for an agent to &quot;fix&quot; verification failures is<br />
to modify the rules themselves. This <strong>blocks that entirely</strong>.</p>
</blockquote>

<h1 id="3-key-risks">3 Key Risks</h1>
<table>
<thead>
<tr>
<th>Risk</th>
<th>Description</th>
<th>Mitigation</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Skill Atrophy</strong></td>
<td>Core competencies erode through AI dependency</td>
<td><strong>Don't approve code you can't explain</strong></td>
</tr>
<tr>
<td><strong>Uncontrolled Autonomy</strong></td>
<td>&quot;Just build it&quot; without design → wrong results</td>
<td>Set direction first with <strong>Playbook</strong></td>
</tr>
<tr>
<td><strong>Blind Trust</strong></td>
<td>AI can be confidently wrong</td>
<td><strong>Always verify</strong> with domain expertise</td>
</tr>
</tbody>
</table>
<br />
<blockquote>
<p>AI is a tool that <strong>amplifies</strong> experts, not <strong>replaces</strong> them.<br />
<strong>&quot;If you can't explain the code the agent wrote, don't approve it.&quot;</strong></p>
